name: Orca SCA Scan Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  orca-sca-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
 
    - name: Run Orca SCA Scan
      id: orca-sca-scan
      uses: orcasecurity/shiftleft-sca-action@v1
      with:
          api_token: ${{ secrets.ORCA_SECURITY_API_TOKEN }}
          project_key: ${{ vars.ORCA_SECURITY_PROJECT_KEY }}
          debug: true
          log_path: orca_debugs/
          path:
            "."

    - name: Orca Debugs
      uses: actions/upload-artifact@v4
      if: ${{ always() && steps.orca-sca-scan.outputs.exit_code != 0 }}
      with:
        name: orca-debugs
        path: |
          orca_debugs
